<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="grad-control-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eef2f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-managed-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <filter id="d2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Arquitetura aiops-control-node</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Control Node: agents-lab (Ubuntu 26.04) · Managed Nodes via SSH 2220–2260</text>

  <!-- Control Node -->
  <g transform="translate(40, 100)" filter="url(#d2-shadow)">
    <rect x="0" y="0" width="260" height="360" rx="12" ry="12" fill="url(#grad-control-d2)" stroke="#cbd5e1" stroke-width="2" />
    <text x="130" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Control Node — agents-lab</text>
    <text x="130" y="52" text-anchor="middle" font-size="11" fill="#64748b">Ubuntu 26.04</text>
    <rect x="20" y="70" width="220" height="40" rx="6" ry="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="130" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Inventário — inventory.ini</text>
    <rect x="20" y="125" width="220" height="40" rx="6" ry="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="130" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Playbooks — ansible/playbooks/</text>
    <rect x="20" y="180" width="220" height="40" rx="6" ry="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="130" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Ansible Vault — segredos cript.</text>
    <text x="20" y="250" font-size="10" fill="#64748b" font-style="italic">Conexão: SSH + Ansible (portas 2220–2260)</text>
  </g>

  <!-- Seta principal -->
  <line x1="300" y1="280" x2="340" y2="280" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="340,275 350,280 340,285" fill="#94a3b8" />

  <!-- Managed Nodes -->
  <g transform="translate(360, 100)" filter="url(#d2-shadow)">
    <rect x="0" y="0" width="600" height="360" rx="12" ry="12" fill="url(#grad-managed-d2)" stroke="#cbd5e1" stroke-width="2" />
    <text x="300" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Managed Nodes (via SSH 2220–2260)</text>

    <!-- Linha Ubuntu Nodes -->
    <rect x="20" y="70" width="560" height="90" rx="8" ry="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
    <text x="40" y="92" font-size="12" font-weight="700" fill="#1565c0">ubuntu_nodes</text>
    <rect x="40" y="110" width="250" height="50" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="165" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">ubuntu</text>
    <text x="165" y="148" text-anchor="middle" font-size="10" fill="#64748b">SSH:2220 · Ubuntu 26.04</text>
    <rect x="300" y="110" width="250" height="50" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="425" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">agents-lab</text>
    <text x="425" y="148" text-anchor="middle" font-size="10" fill="#64748b">SSH:2230 · Ubuntu 26.04</text>

    <!-- Linha RHEL -->
    <rect x="20" y="180" width="170" height="70" rx="8" ry="8" fill="#fff3e0" stroke="#e65100" stroke-width="2" />
    <text x="105" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#e65100">rhel</text>
    <rect x="40" y="210" width="140" height="40" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="110" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">rhel10</text>
    <text x="110" y="246" text-anchor="middle" font-size="10" fill="#64748b">SSH:2240 · RHEL 10.2</text>

    <!-- Linha Amazon Linux -->
    <rect x="210" y="180" width="170" height="70" rx="8" ry="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" />
    <text x="295" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#f9a825">amazonlinux</text>
    <rect x="230" y="210" width="140" height="40" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="300" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">awslinux</text>
    <text x="300" y="246" text-anchor="middle" font-size="10" fill="#64748b">SSH:2250 · Amazon Linux 2023</text>

    <!-- Linha CentOS -->
    <rect x="400" y="180" width="180" height="70" rx="8" ry="8" fill="#fce4ec" stroke="#880e4f" stroke-width="2" />
    <text x="490" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#880e4f">centos</text>
    <rect x="420" y="210" width="150" height="40" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="495" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">centos10</text>
    <text x="495" y="246" text-anchor="middle" font-size="10" fill="#64748b">SSH:2260 · CentOS Stream 10</text>
  </g>

  <!-- Seta de volta -->
  <line x1="960" y1="280" x2="1000" y2="280" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="1000,275 990,280 1000,285" fill="#94a3b8" />
</svg>
