<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="grad-decision-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-hitl-decision-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
    <filter id="decision-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Fluxo de Decisão — Diagramas e Esquemas</text>

  <!-- 1. Início -->
  <g transform="translate(40, 100)" filter="url(#decision-shadow)">
    <rect x="0" y="0" width="180" height="60" rx="8" ry="8" fill="url(#grad-decision-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="90" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">1. Início: Diagnóstico</text>
    <text x="90" y="48" text-anchor="middle" font-size="10" fill="#64748b">via linux-triage / SSH</text>
  </g>

  <!-- Seta 1 -->
  <line x1="220" y1="30" x2="260" y2="30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="260,25 270,30 260,35" fill="#94a3b8" />

  <!-- 2. Auditoria -->
  <g transform="translate(280, 100)" filter="url(#decision-shadow)">
    <rect x="0" y="0" width="180" height="60" rx="8" ry="8" fill="url(#grad-decision-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="90" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">2. Auditoria LPIC-1</text>
    <text x="90" y="48" text-anchor="middle" font-size="10" fill="#64748b">via lpic1-audit</text>
  </g>

  <!-- Seta 2 -->
  <line x1="460" y1="30" x2="500" y2="30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="500,25 510,30 500,35" fill="#94a3b8" />

  <!-- 3. Gerar playbook -->
  <g transform="translate(520, 100)" filter="url(#decision-shadow)">
    <rect x="0" y="0" width="180" height="60" rx="8" ry="8" fill="url(#grad-decision-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="90" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">3. Gerar Playbook</text>
    <text x="90" y="48" text-anchor="middle" font-size="10" fill="#64748b">Idempotente</text>
  </g>

  <!-- Seta 3 -->
  <line x1="700" y1="30" x2="740" y2="30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="740,25 750,30 740,35" fill="#94a3b8" />

  <!-- 4. policy-validator / ansible-lint -->
  <g transform="translate(760, 100)" filter="url(#decision-shadow)">
    <rect x="0" y="0" width="180" height="60" rx="8" ry="8" fill="url(#grad-decision-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="90" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">4. Regras de Segurança</text>
    <text x="90" y="48" text-anchor="middle" font-size="10" fill="#64748b">ansible-lint + validação estática</text>
  </g>

  <!-- Seta para reprovado (volta para 3) -->
  <line x1="940" y1="60" x2="600" y2="60" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <polygon points="600,55 590,60 600,65" fill="#ef4444" />
  <text x="770" y="48" text-anchor="middle" font-size="10" fill="#ef4444">Reprovado</text>

  <!-- Seta para aprovado (para 5) -->
  <line x1="940" y1="60" x2="940" y2="120" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <polygon points="935,120 940,130 945,120" fill="#22c55e" />

  <!-- 5. HITL -->
  <g transform="translate(740, 140)" filter="url(#decision-shadow)">
    <rect x="0" y="0" width="180" height="70" rx="10" ry="10" fill="url(#grad-hitl-decision-d2)" stroke="#d97706" stroke-width="3" />
    <text x="90" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">🛑 5. HITL Gate</text>
    <text x="90" y="50" text-anchor="middle" font-size="10" fill="#92400e">Aprovação Humana</text>
  </g>

  <!-- Seta para rejeitado -->
  <line x1="830" y1="175" x2="740" y2="175" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <polygon points="740,170 730,175 740,180" fill="#ef4444" />
  <text x="790" y="163" text-anchor="middle" font-size="10" fill="#ef4444">Rejeitado</text>

  <!-- Seta para aprovado (para 7) -->
  <line x1="830" y1="175" x2="830" y2="230" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <polygon points="825,230 830,240 835,230" fill="#22c55e" />

  <!-- 6. ansible-lint + check -->
  <g transform="translate(660, 250)" filter="url(#decision-shadow)">
    <rect x="0" y="0" width="180" height="60" rx="8" ry="8" fill="url(#grad-decision-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="90" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">6. Simulação</text>
    <text x="90" y="48" text-anchor="middle" font-size="10" fill="#64748b">--check --diff</text>
  </g>

  <!-- Seta para erro (volta para 3) -->
  <line x1="750" y1="280" x2="610" y2="280" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <polygon points="610,275 600,280 610,285" fill="#ef4444" />
  <text x="680" y="268" text-anchor="middle" font-size="10" fill="#ef4444">Erro</text>

  <!-- Seta para OK (para 7 HITL) -->
  <line x1="750" y1="280" x2="750" y2="210" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <polygon points="745,210 750,220 755,210" fill="#22c55e" />

  <!-- 7. Aplicação real -->
  <g transform="translate(600, 330)" filter="url(#decision-shadow)">
    <rect x="0" y="0" width="200" height="60" rx="8" ry="8" fill="url(#grad-hitl-decision-d2)" stroke="#15803d" stroke-width="2" />
    <text x="100" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">7. Aplicação Real</text>
    <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">ansible-playbook (sem --check)</text>
  </g>

  <!-- Seta para 8 -->
  <line x1="700" y1="360" x2="700" y2="400" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <polygon points="695,400 700,410 705,400" fill="#22c55e" />

  <!-- 8. Validação pós-aplicação -->
  <g transform="translate(660, 420)" filter="url(#decision-shadow)">
    <rect x="0" y="0" width="180" height="60" rx="8" ry="8" fill="url(#grad-hitl-decision-d2)" stroke="#15803d" stroke-width="2" />
    <text x="90" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">8. Validação Pós-Aplicação</text>
  </g>

  <!-- Seta para Fim -->
  <line x1="750" y1="450" x2="750" y2="480" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <polygon points="745,480 750,490 755,480" fill="#22c55e" />

  <!-- Fim -->
  <g transform="translate(710, 480)" filter="url(#decision-shadow)">
    <rect x="0" y="0" width="140" height="40" rx="8" ry="8" fill="#334155" stroke="#334155" stroke-width="2" />
    <text x="70" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Fim — Relatório Técnico</text>
  </g>
</svg>
