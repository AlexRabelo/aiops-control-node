<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="grad-flow-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-hitl-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-loop-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <filter id="flow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Fluxo de Trabalho Obrigatório</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Toda alteração persistente segue este fluxo (conforme AGENTS.md)</text>

  <!-- 1. Diagnóstico -->
  <g transform="translate(40, 100)" filter="url(#flow-shadow)">
    <rect x="0" y="0" width="160" height="70" rx="8" ry="8" fill="url(#grad-flow-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="80" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">1. Diagnóstico</text>
    <text x="80" y="50" text-anchor="middle" font-size="10" fill="#64748b">Coleta somente-leitura via SSH</text>
  </g>

  <!-- Seta 1 -->
  <line x1="200" y1="35" x2="240" y2="35" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="240,30 250,35 240,40" fill="#94a3b8" />

  <!-- 2. Auditoria LPIC-1 -->
  <g transform="translate(260, 100)" filter="url(#flow-shadow)">
    <rect x="0" y="0" width="160" height="70" rx="8" ry="8" fill="url(#grad-flow-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="80" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">2. Auditoria LPIC-1</text>
    <text x="80" y="50" text-anchor="middle" font-size="10" fill="#64748b">Hardening e conformidade</text>
  </g>

  <!-- Seta 2 -->
  <line x1="420" y1="35" x2="460" y2="35" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="460,30 470,35 460,40" fill="#94a3b8" />

  <!-- 3. Playbook YAML -->
  <g transform="translate(480, 100)" filter="url(#flow-shadow)">
    <rect x="0" y="0" width="160" height="70" rx="8" ry="8" fill="url(#grad-flow-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="80" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">3. Playbook YAML</text>
    <text x="80" y="50" text-anchor="middle" font-size="10" fill="#64748b">Idempotente em ansible/playbooks/</text>
  </g>

  <!-- Seta 3 -->
  <line x1="640" y1="35" x2="680" y2="35" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="680,30 690,35 680,40" fill="#94a3b8" />

  <!-- 4. Validação estática -->
  <g transform="translate(700, 100)" filter="url(#flow-shadow)">
    <rect x="0" y="0" width="160" height="70" rx="8" ry="8" fill="url(#grad-flow-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="80" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">4. Validação Estática</text>
    <text x="80" y="50" text-anchor="middle" font-size="10" fill="#64748b">ansible-lint</text>
  </g>

  <!-- Seta 4 -->
  <line x1="860" y1="35" x2="900" y2="35" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="900,30 910,35 900,40" fill="#94a3b8" />

  <!-- 5. Simulação -->
  <g transform="translate(920, 100)" filter="url(#flow-shadow)">
    <rect x="0" y="0" width="160" height="70" rx="8" ry="8" fill="url(#grad-flow-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="80" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">5. Simulação</text>
    <text x="80" y="50" text-anchor="middle" font-size="10" fill="#64748b">--check --diff (dry-run)</text>
  </g>

  <!-- Seta para HITL -->
  <line x1="1080" y1="35" x2="1080" y2="130" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="1075,130 1080,140 1085,130" fill="#94a3b8" />

  <!-- 6. HITL Gate -->
  <g transform="translate(840, 160)" filter="url(#flow-shadow)">
    <rect x="0" y="0" width="200" height="120" rx="10" ry="10" fill="url(#grad-hitl-d2)" stroke="#d97706" stroke-width="3" />
    <text x="100" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">🛑 6. HITL Gate</text>
    <text x="100" y="52" text-anchor="middle" font-size="11" fill="#92400e">Human-in-the-Loop</text>
    <text x="100" y="72" text-anchor="middle" font-size="10" fill="#64748b">Operador aprova/rejeita</text>
    <text x="100" y="92" text-anchor="middle" font-size="10" fill="#64748b">com base em impacto e rollback</text>
  </g>

  <!-- Seta para reprovado (volta para 3) -->
  <line x1="940" y1="220" x2="640" y2="220" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <polygon points="640,215 630,220 640,225" fill="#ef4444" />
  <text x="790" y="208" text-anchor="middle" font-size="10" fill="#ef4444">Reprovado</text>

  <!-- Seta para aprovado (para 7) -->
  <line x1="940" y1="220" x2="940" y2="280" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <polygon points="935,280 940,290 945,280" fill="#22c55e" />

  <!-- 7. Aplicação real -->
  <g transform="translate(780, 300)" filter="url(#flow-shadow)">
    <rect x="0" y="0" width="200" height="70" rx="8" ry="8" fill="url(#grad-loop-d2)" stroke="#15803d" stroke-width="2" />
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">7. Aplicação Real</text>
    <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">ansible-playbook (sem --check)</text>
  </g>

  <!-- Seta para 8 -->
  <line x1="880" y1="335" x2="880" y2="420" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <polygon points="875,420 880,430 885,420" fill="#22c55e" />

  <!-- 8. Validação pós-aplicação -->
  <g transform="translate(780, 440)" filter="url(#flow-shadow)">
    <rect x="0" y="0" width="200" height="70" rx="8" ry="8" fill="url(#grad-loop-d2)" stroke="#15803d" stroke-width="2" />
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">8. Validação Pós-Aplicação</text>
    <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">Critério de validação do relatório</text>
  </g>

  <!-- Seta para Fim -->
  <line x1="880" y1="475" x2="880" y2="520" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <polygon points="875,520 880,530 885,520" fill="#22c55e" />

  <!-- Fim -->
  <g transform="translate(840, 520)" filter="url(#flow-shadow)">
    <rect x="0" y="0" width="120" height="40" rx="8" ry="8" fill="#334155" stroke="#334155" stroke-width="2" />
    <text x="60" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Fim — Relatório Técnico</text>
  </g>

  <!-- Nota lateral -->
  <text x="40" y="530" font-size="11" fill="#64748b" font-style="italic">Regra de ouro: Nunca pule a simulação (--check --diff) nem a aprovação humana (HITL).</text>
</svg>
