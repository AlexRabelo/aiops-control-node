<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="grad-layer1-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-layer2-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-layer3-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-layer4-d2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <filter id="layer-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Camadas de Segurança</text>

  <!-- Camada 1: Prevenção -->
  <g transform="translate(40, 80)" filter="url(#layer-shadow)">
    <rect x="0" y="0" width="220" height="280" rx="12" ry="12" fill="url(#grad-layer1-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Camada 1: Prevenção</text>
    <rect x="20" y="50" width="180" height="60" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="110" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">ansible-lint</text>
    <text x="110" y="86" text-anchor="middle" font-size="10" fill="#64748b">Erros de YAML e boas práticas</text>
    <rect x="20" y="120" width="180" height="60" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="110" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">--check --diff</text>
    <text x="110" y="156" text-anchor="middle" font-size="10" fill="#64748b">Simulação de impacto</text>
    <text x="20" y="220" font-size="10" fill="#64748b" font-style="italic">Validação estática antes de qualquer mudança</text>
  </g>

  <!-- Seta 1 -->
  <line x1="260" y1="220" x2="290" y2="220" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="290,215 300,220 290,225" fill="#94a3b8" />

  <!-- Camada 2: Detecção -->
  <g transform="translate(310, 80)" filter="url(#layer-shadow)">
    <rect x="0" y="0" width="220" height="280" rx="12" ry="12" fill="url(#grad-layer2-d2)" stroke="#94a3b8" stroke-width="2" />
    <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Camada 2: Detecção</text>
    <rect x="20" y="50" width="180" height="60" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="110" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">--check --diff</text>
    <text x="110" y="86" text-anchor="middle" font-size="10" fill="#64748b">Simulação de impacto</text>
    <rect x="20" y="120" width="180" height="60" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="110" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Dry-run</text>
    <text x="110" y="156" text-anchor="middle" font-size="10" fill="#64748b">Sem alterações reais</text>
    <text x="20" y="220" font-size="10" fill="#64748b" font-style="italic">Mostra o que mudaria sem aplicar</text>
  </g>

  <!-- Seta 2 -->
  <line x1="530" y1="220" x2="560" y2="220" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="560,215 570,220 560,225" fill="#94a3b8" />

  <!-- Camada 3: Autorização -->
  <g transform="translate(580, 80)" filter="url(#layer-shadow)">
    <rect x="0" y="0" width="220" height="280" rx="12" ry="12" fill="url(#grad-layer3-d2)" stroke="#d97706" stroke-width="3" />
    <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Camada 3: Autorização</text>
    <rect x="20" y="50" width="180" height="60" rx="8" ry="8" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <text x="110" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Human-in-the-Loop</text>
    <text x="110" y="86" text-anchor="middle" font-size="10" fill="#92400e">Aprovação explícita do operador</text>
    <rect x="20" y="120" width="180" height="60" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="110" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">HITL Gate</text>
    <text x="110" y="156" text-anchor="middle" font-size="10" fill="#64748b">aprovar / rejeitar / ajustar / adiar</text>
    <text x="20" y="220" font-size="10" fill="#64748b" font-style="italic">Ponto de parada sem confirmação humana</text>
  </g>

  <!-- Seta 3 -->
  <line x1="800" y1="220" x2="830" y2="220" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="830,215 840,220 830,225" fill="#94a3b8" />

  <!-- Camada 4: Auditoria -->
  <g transform="translate(850, 80)" filter="url(#layer-shadow)">
    <rect x="0" y="0" width="220" height="280" rx="12" ry="12" fill="url(#grad-layer4-d2)" stroke="#15803d" stroke-width="2" />
    <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Camada 4: Auditoria</text>
    <rect x="20" y="50" width="180" height="60" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="110" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Registro de decisões</text>
    <text x="110" y="86" text-anchor="middle" font-size="10" fill="#64748b">HITL e relatórios técnicos</text>
    <rect x="20" y="120" width="180" height="60" rx="8" ry="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="110" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">MEMORY.md</text>
    <text x="110" y="156" text-anchor="middle" font-size="10" fill="#64748b">Histórico do projeto</text>
    <text x="20" y="220" font-size="10" fill="#64748b" font-style="italic">Rastreabilidade de todas as alterações</text>
  </g>
</svg>
