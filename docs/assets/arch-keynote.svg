<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="grad-control" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eef2f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-managed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-hitl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-loop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Título -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Arquitetura aiops-control-node — Loop AIOps + HITL</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Control Node: agents-lab (Ubuntu 26.04) · Managed Nodes via SSH 2220–2260</text>

  <!-- Control Node -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="280" rx="12" ry="12" fill="url(#grad-control)" stroke="#cbd5e1" stroke-width="2" />
    <text x="130" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Control Node — agents-lab</text>
    <text x="130" y="52" text-anchor="middle" font-size="11" fill="#64748b">Ubuntu 26.04 · SSH porta 2230</text>
    <rect x="20" y="70" width="220" height="40" rx="6" ry="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="130" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Ansible Control Node</text>
    <rect x="20" y="125" width="220" height="36" rx="6" ry="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="130" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">inventory.ini + Playbooks</text>
    <rect x="20" y="175" width="220" height="36" rx="6" ry="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="130" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Ansible Vault (segredos)</text>
    <rect x="20" y="225" width="220" height="36" rx="6" ry="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="130" y="247" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">ansible-lint + --check --diff</text>
    <text x="20" y="300" font-size="10" fill="#64748b">Fluxo: Diagnóstico → Auditoria → Validação → HITL → Aplicação</text>
  </g>

  <!-- Seta principal -->
  <line x1="300" y1="240" x2="340" y2="240" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="340,235 350,240 340,245" fill="#94a3b8" />

  <!-- Managed Nodes -->
  <g transform="translate(360, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="280" rx="12" ry="12" fill="url(#grad-managed)" stroke="#cbd5e1" stroke-width="2" />
    <text x="130" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Managed Nodes</text>
    <text x="130" y="52" text-anchor="middle" font-size="11" fill="#64748b">5 hosts via SSH 2220–2260</text>

    <rect x="20" y="70" width="105" height="70" rx="8" ry="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
    <text x="72" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">ubuntu</text>
    <text x="72" y="108" text-anchor="middle" font-size="9" fill="#1e293b">:2220</text>
    <text x="72" y="122" text-anchor="middle" font-size="9" fill="#64748b">Ubuntu 26.04</text>

    <rect x="135" y="70" width="105" height="70" rx="8" ry="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
    <text x="187" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#1565c0">agents-lab</text>
    <text x="187" y="108" text-anchor="middle" font-size="9" fill="#1e293b">:2230</text>
    <text x="187" y="122" text-anchor="middle" font-size="9" fill="#64748b">Ubuntu 26.04</text>

    <rect x="20" y="160" width="105" height="70" rx="8" ry="8" fill="#fff3e0" stroke="#e65100" stroke-width="2" />
    <text x="72" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#e65100">rhel10</text>
    <text x="72" y="198" text-anchor="middle" font-size="9" fill="#1e293b">:2240</text>
    <text x="72" y="212" text-anchor="middle" font-size="9" fill="#64748b">RHEL 10.2</text>

    <rect x="135" y="160" width="105" height="70" rx="8" ry="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" />
    <text x="187" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#f9a825">awslinux</text>
    <text x="187" y="198" text-anchor="middle" font-size="9" fill="#1e293b">:2250</text>
    <text x="187" y="212" text-anchor="middle" font-size="9" fill="#64748b">Amazon Linux 2023</text>

    <rect x="20" y="250" width="105" height="70" rx="8" ry="8" fill="#fce4ec" stroke="#880e4f" stroke-width="2" />
    <text x="72" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#880e4f">centos10</text>
    <text x="72" y="286" text-anchor="middle" font-size="9" fill="#1e293b">:2260</text>
    <text x="72" y="300" text-anchor="middle" font-size="9" fill="#64748b">CentOS Stream 10</text>
  </g>

  <!-- Seta para HITL -->
  <line x1="620" y1="240" x2="660" y2="240" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="660,235 670,240 660,245" fill="#94a3b8" />

  <!-- HITL Gate -->
  <g transform="translate(680, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="280" rx="12" ry="12" fill="url(#grad-hitl)" stroke="#f59e0b" stroke-width="2" />
    <text x="100" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">🛑 HITL Gate</text>
    <text x="100" y="57" text-anchor="middle" font-size="11" fill="#92400e">Human-in-the-Loop</text>
    <rect x="20" y="80" width="160" height="70" rx="10" ry="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
    <text x="100" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Aprovação</text>
    <text x="100" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Explícita</text>
    <rect x="20" y="160" width="160" height="36" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="182" text-anchor="middle" font-size="10" fill="#64748b">--check --diff simulado</text>
    <rect x="20" y="206" width="160" height="36" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="228" text-anchor="middle" font-size="10" fill="#64748b">ansible-playbook (real)</text>
    <rect x="20" y="252" width="160" height="36" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="274" text-anchor="middle" font-size="10" fill="#64748b">Registro em MEMORY.md</text>
  </g>

  <!-- Seta para Loop -->
  <line x1="880" y1="240" x2="920" y2="240" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <polygon points="920,235 930,240 920,245" fill="#94a3b8" />

  <!-- Loop AIOps -->
  <g transform="translate(740, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="280" rx="12" ry="12" fill="url(#grad-loop)" stroke="#22c55e" stroke-width="2" />
    <text x="100" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">🔄 Loop AIOps</text>
    <rect x="20" y="60" width="160" height="40" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">1. Diagnóstico</text>
    <text x="100" y="96" text-anchor="middle" font-size="9" fill="#64748b">hostnamectl, df, ss</text>
    <rect x="20" y="110" width="160" height="40" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">2. Auditoria</text>
    <text x="100" y="146" text-anchor="middle" font-size="9" fill="#64748b">LPIC-1 hardening</text>
    <rect x="20" y="160" width="160" height="40" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="182" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">3. Validação</text>
    <text x="100" y="196" text-anchor="middle" font-size="9" fill="#64748b">lint + --check --diff</text>
    <rect x="20" y="210" width="160" height="40" rx="6" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="232" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">4. Aplicação</text>
    <text x="100" y="246" text-anchor="middle" font-size="9" fill="#64748b">--ask-become-pass</text>
    <path d="M100 280 Q100 310 160 310 T220 310 T220 280 T160 280 T100 280" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,4" />
    <text x="160" y="296" text-anchor="middle" font-size="9" fill="#166534">volta à observação</text>
  </g>
</svg>
